runtime:
  physics_dt: 0.005
  control_substeps: 4
  backend: cuda
  batch_physics_layout: static_template
  static_template:
    profile: articulated_fused_ground_contact_v1
    kinematics_backend: taichi
    contact_precision: f32
    cuda_graph: true
    contact:
      response_backend: active_slot_cholesky_f32_v1
      fixed_topology_child_schur: true
      root_factor_6x6: true
  enable_ground_contact: true
  enable_domain_boundary_contact: false
  integrator: implicitfast
  world_randomization:
    profile: disabled
observation:
  schema_version: task-env-go2-walk-observation-v1
  include_privileged_state: false
action:
  rsl_action_profile: unitree_go2_reference
episode:
  horizon: 1000
render:
  # Training observation defaults favor interactive throughput. Use
  # raytracer/high resolution in a user YAML when final visual quality matters.
  backend: rasterizer
  width: 1080
  height: 720
  parallel:
    num: 256
    columns: 16
    cell_width: 1.0
    cell_depth: 1.0
    padding: 0.0
  training:
    every: 1
