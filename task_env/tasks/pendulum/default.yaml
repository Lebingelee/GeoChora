# Task-owned public defaults.  ``render.parallel.num`` is an upper bound;
# training resolves it to min(num_env, render.parallel.num).
render:
  backend: raytracer
  width: 960
  height: 720
  parallel:
    num: 256
    columns: 16
    cell_width: 1.0
    cell_depth: 1.0
    padding: 0.0
  training:
    every: 1
