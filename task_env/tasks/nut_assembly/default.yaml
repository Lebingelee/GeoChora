# Task-owned defaults may only use the public common configuration surface.
# Topology, objects, success semantics, runtime and robot declarations remain
# owned by the task class / resolved robot description.
observation:
  schema_version: task-env-state-v2
  include_privileged_state: true
episode:
  horizon: 1000
runtime:
  # Use the mixed articulated/free row-PGS route as the task default.
  rigid_solver_backend: row_pgs
robot:
  controller:
    kind: delta_pose
    reference: world
    rotation_representation: quaternion_wxyz
render:
  backend: raytracer
  width: 960
  height: 720
  parallel:
    num: 256
    columns: 16
    cell_width: 1.0
    cell_depth: 1.0
    padding: 0.0
  training:
    every: 1
