basis:
- Remote review branch resolves to the frozen P1.5 implementation commit 9c5fcc26fa1164baccd72bfca450d79187b27470.
- 'R4 is additive/versioned: historical PickCubeSolution source is unchanged; PickCubeReadinessSolution/pick-cube-readiness-v1
  is a separate expert route.'
- StageCompletionPolicy explicitly separates pose_ready, gripper_ready, and task_outcome completion.
- CanonicalControlReadiness is provider-neutral and reaches the expert through ExpertExecutionInfo rather than controller-private
  memory or provider-native state.
- ProductionCanonicalPandaController compute/profile/identity behavior is unchanged by R4; R4 adds a read-only readiness
  projection.
- Planned expert actions and readiness-wait actions are separately accounted; the planned action budget remains
  120 and the provider-independent global safety cap is mechanically derived as 2500 control ticks.
- 'Lift completion is outcome-driven: task success is cube_lift >= 0.10 m and the frozen collection endpoint is
  cube_lift >= 0.105 m; final EE pose deadband is not an additional success requirement.'
- R5 final C2 qualification passed all four provider x seed intersections without changing tracked source, oracle,
  controller, expert, task semantics, provider configuration, or ResetSamples.
- R1 prerequisites, R4 provider-free checks, P1.1-P1.4 regressions, provider-free guard, roundtrip checks, and git
  diff --check all passed.
