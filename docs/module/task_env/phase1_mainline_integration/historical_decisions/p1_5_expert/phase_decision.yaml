strongest_allowed_claim: GeoPhys and MuJoCo satisfy the bounded P1.5 canonical manipulation-control and closed-loop
  expert qualification for the frozen PickCube EvaluationSampleSet. Both providers execute the same Geochora-owned
  controller and versioned readiness-aware expert semantics, pass the locked C1 prerequisites, and reach the declared
  PickCube collection endpoint under the same task and readiness contracts.
