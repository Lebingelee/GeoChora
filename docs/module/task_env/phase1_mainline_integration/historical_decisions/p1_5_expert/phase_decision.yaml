accepted_scope:
- bounded Phase-I PickCube canonical manipulation-control contract for GeoPhys and MuJoCo
- 'four-layer control trace: requested action -> canonical action -> canonical controller target -> applied control'
- provider-neutral canonical control feedback and readiness projection for the audited Panda gripper profile
- C1 open-loop canonical-target replay prerequisites under locked tolerances
- versioned readiness-aware PickCube expert semantics
- C2 closed-loop expert qualification on the frozen EvaluationSampleSet seeds 31 and 73
- separation of planned action completion, physical stage readiness, and task outcome completion
- separate accounting of planned expert actions and readiness-wait control ticks
not_granted:
- exact cross-provider dynamics equivalence
- provider-wide manipulation qualification beyond the frozen PickCube intersections
- qualification of all randomized PickCube resets or statistical success-rate claims
- canonical trajectory/dataset portability
- state-policy or visuomotor-policy portability
- SAPIEN or Genesis qualification
- NutAssemblySquare precision/contact qualification
- P1.6 or later Phase-I qualification
known_debt:
- The accepted C2 result is intentionally bounded to PickCube seeds 31 and 73.
- GeoPhys and MuJoCo exhibit different readiness-wait durations, especially during gripper closure; this is retained
  as diagnostic behavioral divergence rather than treated as a failure under the bounded task contract.
- The R2 MuJoCo native instability is retained as historical failure Evidence but was not reproduced under the corrected
  readiness-aware execution in R4/R5.
- CanonicalControlReadiness is qualified only for the audited Panda experimental_rate_limited gripper/control profile,
  not as a universal force/readiness abstraction.
- Legacy PickCubeSolution remains preserved for historical Evidence compatibility; pick-cube-readiness-v1 is the
  accepted P1.5 expert route.
- Canonical trajectory schema, T+1 observation/T transition recording, dataset replay, and policy transfer remain
  P1.6 work.
