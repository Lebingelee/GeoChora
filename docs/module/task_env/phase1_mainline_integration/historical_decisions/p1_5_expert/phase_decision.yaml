required_before_p1_6_implementation:
- Place this Human phase_decision.yaml under workspace/qualification/phase1/p1_5_expert/.
- P1.6 implementation must start from a revision that contains approved P1.5 commit 9c5fcc26fa1164baccd72bfca450d79187b27470;
  current main f977528b9b9866c50afcf8ea9b5f5deadce60892 alone is not an acceptable implementation baseline.
- Treat the accepted P1.5 controller/expert/readiness contracts as frozen inputs; any behavioral modification requires
  a separate governed recovery/requalification.
- Freeze the P1.6 trajectory/dataset/evaluation oracle before the first governed record/replay or policy-transfer
  execution.
