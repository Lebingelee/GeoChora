schema: geochora.phase_decision.v1

phase: p1_4_camera
decision: approve

judge:
  type: human

basis:
  - >
    P1.4 introduces a versioned camera-observation contract linked to the
    approved Task Artifact identity without mutating task-artifact-v0.
  - >
    Camera mount and canonical optical frames are explicitly separated, with
    unambiguous T_world_from_mount, T_world_from_camera, and
    T_camera_from_world transforms.
  - >
    The canonical optical frame is right-handed with +X image-right,
    +Y image-down, and +Z forward, while the legacy +X-forward/+Z-up camera
    convention is preserved through an explicit fixed transform.
  - >
    Camera intrinsics, horizontal-FOV derivation, pixel-center semantics,
    projection, and back-projection are Geochora-owned provider-neutral
    geometry rather than provider-native camera metadata.
  - >
    Canonical depth is defined as float32 metric optical-Z depth and the
    GeoPhys native ray-distance route is explicitly converted before public
    exposure.
  - >
    GeoPhys and MuJoCo both pass the locked fixed-camera projection,
    dynamic attached-camera projection, depth/back-projection, image-schema,
    and post-control-step timestamp checks.
  - >
    Dynamic camera geometry is resolved from the measured CanonicalStateView
    parent pose rather than assuming identical provider dynamics.
  - >
    Render-provider admission is independent of physics capability admission,
    fails before native construction for missing capabilities, and does not
    silently fall back for unsupported or cross-provider pairings.
  - >
    The P1.4 production-facing GeoPhys route does not depend on the
    diagnostic-private visualizer._camera handle.
  - >
    The approved P1.1, P1.2, and P1.3 regression routes remain passing.

accepted_scope:
  - camera-observation-v0 linked contract
  - canonical mount/optical frame separation
  - explicit camera transform naming
  - provider-neutral K/FOV/pixel convention
  - provider-neutral projection/back-projection
  - canonical optical-Z metric depth
  - GeoPhys native ray-distance to canonical-depth conversion
  - MuJoCo native depth canonicalization
  - GeoPhys CPU native camera/render geometry route
  - MuJoCo CPU native camera/render geometry route
  - fixed-camera projection geometry
  - dynamically attached-camera geometry
  - bounded depth back-projection
  - declared RGB shape/layout/dtype normalization
  - post-control-step camera timestamp synchronization
  - fail-closed render capability admission
  - native GeoPhys/GeoPhys and MuJoCo/MuJoCo pairings

not_granted:
  - RGB photometric equivalence
  - visuomotor policy portability
  - complete PickCube visual-observation integration
  - asynchronous or multi-rate camera scheduling
  - camera noise/randomization qualification
  - dynamic scene-mesh rendering qualification
  - cross physics/render provider pairing support
  - provider-wide renderer qualification
  - GPU render qualification
  - trajectory/recorder qualification
  - policy qualification
  - P1.5 canonical-control qualification

known_debt:
  - >
    Provider-specific invalid/background and full near/far clipping behavior
    has not been fully qualified beyond the bounded closed-surface fixtures.
  - >
    The current CameraRenderSource migration bridge supports static closed
    triangle geometry only; dynamic scene geometry, materials, and textures
    remain outside the accepted scope.
  - >
    MuJoCo and GeoPhys native clipping/frustum internals remain
    provider-native and are not claimed to be numerically equivalent.
  - >
    Full PickCube production RGB/depth observation integration remains
    deferred to later trajectory/visuomotor phases.
  - >
    GeoPhys native Taichi rendering resources remain process-owned and are
    reclaimed on isolated worker exit.

required_before_p1_5:
  - freeze the P1.4 implementation commit as the P1.5 baseline
  - preserve the approved camera contracts while introducing canonical control
  - define the initial canonical manipulation target as arm joint-position
    target plus gripper target
  - freeze C1 open-loop and C2 closed-loop expert acceptance criteria before
    cross-provider manipulation execution
  - keep controller computation Geochora-owned and provider actuator
    realization provider-owned

