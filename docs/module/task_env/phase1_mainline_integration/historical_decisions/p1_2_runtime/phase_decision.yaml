schema: geochora.phase_decision.v1

phase: p1_2_runtime
decision: approve

judge:
  type: human

basis:
  - >
    The approved P1.1 Task Artifact and ExecutionSpec now drive an additive
    provider-neutral runtime lifecycle with capability admission before native
    materialization.
  - >
    Geochora generates immutable provider-neutral ResetSamples before provider
    execution, and the exact same serialized requests are consumed by GeoPhys
    and MuJoCo.
  - >
    GeoPhys and MuJoCo independently materialize the same bounded PickCube
    source route and return measured RealizedInitialState and CanonicalStateView
    values without exposing provider-native IDs or solver storage.
  - >
    Requested Panda joint states and cube poses are realized within the
    pre-declared P1.2 reset representation bounds on both providers.
  - >
    Repeat reset is deterministic for the tested samples, provider task
    randomness does not replace the ResetSample, and capability admission
    fails before native materialization when a required capability is removed.
  - >
    Both providers expose the required semantic state and advance exactly one
    canonical control boundary with the approved Task Artifact timebase.
  - >
    The canonical PickCube semantic evaluator consumes measured state from
    both providers without provider-private task semantics.
  - >
    The P1.2 detector and evidence make no physics, contact, controller,
    task-success, or provider-qualification claim.

accepted_scope:
  - provider-neutral runtime session lifecycle
  - top-level physics-provider selection through ExecutionSpec
  - fail-closed pre-materialization capability admission
  - provider-neutral deterministic PickCube ResetSample generation
  - requested-versus-realized reset recording
  - GeoPhys CPU materialization for the bounded PickCube route
  - MuJoCo CPU materialization for the bounded PickCube route
  - semantic CanonicalStateView projection
  - reset repeatability for the tested samples
  - one-control-boundary canonical timebase progression
  - provider-free canonical semantic wiring
  - zero-settle P1.2 route

not_granted:
  - physics equivalence qualification
  - contact equivalence qualification
  - controller equivalence qualification
  - PickCube success parity
  - expert execution qualification
  - camera or rendering qualification
  - trajectory or replay qualification
  - policy portability
  - GPU provider qualification
  - nonzero-settle qualification
  - GeoPhys provider-wide qualification
  - MuJoCo provider-wide qualification
  - any new formally qualified intersection

known_debt:
  - derive provider manifest version from actual runtime/provider provenance
    rather than a source-code-pinned GeoPhys revision
  - version and freeze the materialization/source recipe independently of
    Task Artifact identity before stronger qualification
  - evolve the current RuntimeSource migration object before treating it as
    a general production materialization contract
  - separate stable asset identity from MJCF/source representation
  - nonzero settle behavior remains unsupported in the bounded route
  - provider_seed semantics are not exercised because the tested CPU route
    has no provider-side task randomization

required_before_p1_3:
  - freeze the P1.2 runtime implementation commit
  - make provider-version provenance runtime-derived or otherwise
    mechanically bound to the actual provider revision
  - define analytical/provider-independent oracle and tolerance for each
    P1.3 conformance probe
  - freeze the P1.3 Asset/Frame, Free-fall, Joint-tracking, Camera/Depth,
    and Contact probe inputs before running them

implementation_commit:
  geochora: 22b0a229a741a7e7f11663cd5a0635e3ed6053c4

provider_baseline:
  geophys: c665ce5028a12bb4d2afe49f05e015fa9b684a39

tested_providers:
  - geophys
  - mujoco
